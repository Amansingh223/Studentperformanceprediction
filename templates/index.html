<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Performance Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d12;
  --surface:#111720;
  --border:rgba(255,255,255,0.07);
  --text:#eef1f7;
  --muted:#6b7a8d;
  --accent:#6366f1;
  --accent2:#a78bfa;
  --accent-soft:rgba(99,102,241,0.12);
  --green:#22c55e;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(circle at 20% 20%,rgba(99,102,241,0.15) 0%,transparent 40%),
                   radial-gradient(circle at 80% 80%,rgba(167,139,250,0.10) 0%,transparent 40%);}
.hero{text-align:center;max-width:680px;padding:2rem;}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid rgba(99,102,241,0.25);border-radius:999px;padding:0.4rem 1rem;color:var(--accent2);font-size:0.75rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:2rem;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,6vw,5rem);line-height:0.95;letter-spacing:-0.04em;margin-bottom:1.2rem;}
h1 em{color:var(--accent2);font-style:normal;}
p{color:var(--muted);font-size:1rem;line-height:1.8;max-width:500px;margin:0 auto 2.5rem;}
.cta{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:999px;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;padding:0.9rem 2.2rem;text-decoration:none;box-shadow:0 8px 32px rgba(99,102,241,0.35);transition:transform 0.2s,box-shadow 0.2s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(99,102,241,0.45);}
.stats{display:flex;justify-content:center;gap:3rem;margin-top:3.5rem;padding-top:2.5rem;border-top:1px solid var(--border);}
.stat-val{font-family:'Playfair Display',serif;font-size:2rem;color:var(--text);}
.stat-label{font-size:0.78rem;color:var(--muted);margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.08em;}
</style>
</head>
<body>
<div class="hero">
  <div class="badge"><span class="dot"></span> ML Powered</div>
  <h1>Predict Student <em>Math</em> Performance</h1>
  <p>Enter student demographics and scores to instantly predict math performance using an ensemble of trained ML models.</p>
  <a href="/predict" class="cta">Start Prediction →</a>
  <div class="stats">
    <div><div class="stat-val">9</div><div class="stat-label">Models Trained</div></div>
    <div><div class="stat-val">1000</div><div class="stat-label">Students Dataset</div></div>
    <div><div class="stat-val">88%+</div><div class="stat-label">R² Accuracy</div></div>
  </div>
</div>
</body>
</html>
